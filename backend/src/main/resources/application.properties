spring.application.name=tfc-ifmis-core
server.port=8081

# --- Local/dev database: file-based H2, persists in ./data between restarts ---
spring.datasource.url=jdbc:h2:file:./data/tfc-ifmis-core;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Portal JWT ---
# ALWAYS override tfc.jwt.secret via the TFC_JWT_SECRET env var outside local dev.
tfc.jwt.secret=${TFC_JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-deployment-32bytes}
tfc.jwt.expiry-minutes=60

# --- Stubbed external integrations — see TfraClientStub / NotificationGatewayStub ---
tfc.esb.provider=stub
tfc.notifications.provider=stub

logging.level.co.tz.tfc.ifmis=DEBUG
