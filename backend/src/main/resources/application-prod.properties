# Production profile — activate with SPRING_PROFILES_ACTIVE=prod. Every secret comes from the
# environment and has NO default, so the app refuses to start if one is missing.

# --- PostgreSQL ---
spring.datasource.url=${TFC_DB_URL}
spring.datasource.username=${TFC_DB_USERNAME}
spring.datasource.password=${TFC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# No migration tool yet: "update" creates/extends tables. Switch to Flyway + "validate" before go-live.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# --- Security ---
tfc.jwt.secret=${TFC_JWT_SECRET}
tfc.cors.allowed-origins=${TFC_CORS_ALLOWED_ORIGINS}
tfc.rate-limit.trust-forwarded-for=${TFC_TRUST_FORWARDED_FOR:true}

# --- Real integrations (the stubs only load when these are "stub") ---
tfc.esb.provider=${TFC_ESB_PROVIDER:live}
tfc.notifications.provider=${TFC_NOTIFICATIONS_PROVIDER:live}

logging.level.co.tz.tfc.ifmis=INFO
